<!-- ============================================================
     PRÁTICA 1 — Primeiro Script JavaScript
     Objetivo: botão que exibe alert() e registra no console
     ============================================================ -->

<!-- Declara documento HTML5 -->
<!DOCTYPE html>

<!-- Idioma português do Brasil para acessibilidade e SEO -->
<html lang="pt-BR">

<head>
    <!-- Codificação UTF-8 para acentos (ã, ç, etc.) -->
    <meta charset="UTF-8">
    <!-- Viewport: layout responsivo em celulares -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Título da aba do navegador -->
    <title>Prática 1 — Primeiro Script</title>
    <!-- Folha de estilo exclusiva desta prática -->
    <link rel="stylesheet" href="pratica1.css">
</head>

<!-- Classe pratica1: escopo dos estilos no CSS -->
<body class="pratica1">

    <!-- Conteúdo principal da página -->
    <main>
        <!-- Título da padaria fictícia -->
        <h1>Padaria Pão e Bytes</h1>
        <!-- id usado pelo JS com getElementById("btnMensagem") -->
        <button type="button" id="btnMensagem">Ver Mensagem</button>
    </main>

    <!-- Script externo: lógica separada do HTML -->
    <script src="js/pratica1.js"></script>
</body>

</html>
