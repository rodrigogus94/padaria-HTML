<!-- Adicione este card de produto dentro da sua coluna ou grid -->
<!-- shadow adiciona uma sombra sutil e elegante ao redor do card -->
<div class="card shadow" style="max-width: 350px; margin: 20px auto;">
    <!-- Imagem ilustrativa do nosso croissant de chocolate --> <img
        src="https://images.unsplash.com/photo-1555507036-ab1f4038808a?w=500&auto=format&fit=crop&q=60"
        class="card-img-top" alt="Croissant">
    <div class="card-body text-center"> <!-- Título do produto -->
        <h5 class="card-title fw-bold">Croissant de Chocolate Belga</h5> <!-- Descrição sedutora do produto -->
        <p class="card-text text-muted">Massa folhada super leve com recheio cremoso de chocolate belga 70% e raspas.
        </p> <!-- Preço em destaque usando uma etiqueta (badge) verde -->
        <div class="mb-3"> <span class="badge bg-success fs-5">R$ 14,90</span> </div>
        <!-- Botão de ação (w-100 faz ocupar toda a largura do card) --> <a href="#"
            class="btn btn-primary w-100 fw-bold text-white">Quero Esse! </a>
    </div>
</div>
